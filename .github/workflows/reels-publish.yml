name: Reels - publish

on:
  schedule:
    # Each run reads Telegram approvals / voice notes, then posts ONE approved Reel.
    - cron: "0 7 * * *"      # 12:30 IST
    - cron: "30 10 * * *"    # 16:00 IST
    - cron: "0 14 * * *"     # 19:30 IST
    - cron: "30 16 * * *"    # 22:00 IST
    - cron: "0 19 * * *"     # 00:30 IST (evening in Spain)
  workflow_dispatch:

permissions:
  contents: write            # the draft queue is stored on a GitHub release
  issues: write              # drafts are listed in an issue for approval

concurrency:
  group: reels-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reels/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: reels/models
          key: kokoro-v1.0
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # With only CRON_TOKEN (already set for auto-post), scripts, match data and publishing
          # go through the site, which holds the Groq and Facebook keys in Vercel.
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Optional: set these to bypass the site. Same names as the Vercel env vars.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.REELS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.REELS_TELEGRAM_CHAT_ID }}
          DAILY_VIDEOS: ${{ vars.DAILY_VIDEOS }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
          VOICE_MODE: ${{ vars.VOICE_MODE }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE }}
          AUTO_APPROVE_AFTER_HOURS: ${{ vars.AUTO_APPROVE_AFTER_HOURS }}
          COMMENT_LINK: ${{ vars.COMMENT_LINK }}
        run: python -m autopilot publish
